<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Persona Showdown</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: Verdana, Helvetica, Arial, sans-serif; 
            font-size: 10pt;
            background-color: #111; 
            background-size: cover;
            background-position: center;
            color: #eee; 
            overflow: hidden; 
            height: 100vh; 
            width: 100vw; 
            display: flex; 
            flex-direction: column; 
        }

        .ps-button {
            background: linear-gradient(to bottom, #f9f9f9, #e5e5e5);
            border: 1px solid #aaa;
            border-radius: 3px;
            color: #333;
            text-shadow: 0 1px 0 #fff;
            cursor: pointer;
            font-family: Verdana, Helvetica, Arial, sans-serif;
            font-size: 10pt;
            padding: 4px 10px;
        }
        .ps-button:hover:not(:disabled) { background: linear-gradient(to bottom, #fff, #f0f0f0); border-color: #999; }
        .ps-button:disabled { background: #ddd; color: #888; text-shadow: none; cursor: not-allowed; border-color: #bbb; }

        /* --- PESTAÑAS (Top Bar) --- */
        #top-bar { 
            height: 35px; background: rgba(0, 0, 0, 0.6); display: flex; align-items: flex-end; 
            padding: 0 10px; border-bottom: 1px solid #444; flex-shrink: 0; justify-content: space-between;
        }
        .tabs-container { display: flex; gap: 2px; }
        .tab-btn {
            background: rgba(30, 30, 30, 0.8); color: #aaa; border: 1px solid #111; border-bottom: none;
            padding: 6px 14px; border-radius: 4px 4px 0 0; cursor: pointer;
            font-size: 13px; transition: background 0.2s, color 0.2s; height: 28px;
        }
        .tab-btn.active { background: rgba(0, 0, 0, 0.5); color: #fff; height: 30px; font-weight: bold; border: 1px solid #555; border-bottom: none; }

        #main-content { flex-grow: 1; position: relative; width: 100vw; background: rgba(0, 0, 0, 0.3); }
        .pantalla { display: none !important; height: 100%; width: 100%; }
        .pantalla.active { display: flex !important; }

        /* --- PANTALLA INICIO --- */
        #pantalla-inicio { padding: 20px; gap: 20px; justify-content: center; overflow-y: auto; }
        #home-left { width: 250px; display: flex; flex-direction: column; gap: 15px; }
        #home-mid { width: 300px; display: flex; flex-direction: column; gap: 15px; }
        #home-right { width: 400px; background: rgba(10, 10, 10, 0.8); border: 1px solid #333; border-radius: 4px; display: flex; flex-direction: column; }

        .big-battle-btn { width: 100%; padding: 12px 5px; font-size: 18px; font-weight: bold; margin: 10px 0; }
        .menu-btn { width: 100%; padding: 6px; text-align: center; font-weight: bold; color: #444; }

        #lobby-header { padding: 8px 10px; background: rgba(0,0,0,0.5); border-bottom: 1px solid #222; color: #fff; font-size: 14px; font-weight: bold; }
        #lobby-chat-content { flex-grow: 1; padding: 10px; overflow-y: auto; font-size: 13px; line-height: 1.4; color: #ccc; }
        #lobby-input { padding: 5px; background: rgba(0,0,0,0.5); border-top: 1px solid #222; display: flex; }
        #lobby-input input { flex-grow: 1; background: #fff; border: 1px solid #aaa; color: #222; padding: 5px; border-radius: 3px; font-family: Verdana; }

        /* --- PANTALLA BATALLA (Reciclada de tu diseño) --- */
        #pantalla-batalla { display: none; height: 100%; width: 100%; }
        #left-pane { flex: 6; display: flex; flex-direction: column; background: #222; border-right: 1px solid #111; }
        #right-pane { flex: 4; display: flex; flex-direction: column; background: rgba(20,20,20,0.9); }
        #arena { flex: 6; position: relative; background-color: #8fb88b; background-size: cover; border-bottom: 1px solid #111; }
        .battler { position: absolute; display: flex; flex-direction: column; align-items: center; }
        #player-side { bottom: 10px; left: 15%; } 
        #opponent-side { top: 20px; right: 20%; }
        .sprite { width: 260px; height: 260px; object-fit: contain; }
        #sprite-p1 { transform: scaleX(-1); } 
        .hp-box { background: rgba(0, 0, 0, 0.75); padding: 4px 8px; border-radius: 4px; font-size: 11px; z-index: 10; text-align: right; width: 200px; border: 1px solid #333;}
        #player-side .hp-box { margin-bottom: -20px; text-align: left;} 
        #opponent-side .hp-box { margin-bottom: -15px; }
        .hp-bar-fill { background: #48c774; height: 100%; width: 100%; transition: width 0.3s; }
        #controls { flex: 4; background: #dedede; padding: 10px; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #fff;}
        .moves-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 5px; }
        .move-btn { background: linear-gradient(to bottom, #f9f9f9, #e5e5e5); border: 1px solid #aaa; border-radius: 3px; padding: 8px; cursor: pointer; text-align: center; color: #333; position: relative; font-weight: bold; }
    </style>
</head>
<body>

    <div id="top-bar">
        <div class="tabs-container">
            <button class="tab-btn active" id="tab-btn-inicio" onclick="cambiarTab('inicio')">Home</button>
            <button class="tab-btn" id="tab-btn-teambuilder" onclick="cambiarTab('teambuilder')">Teambuilder</button>
            <button class="tab-btn" id="tab-btn-batalla" onclick="cambiarTab('batalla')" style="display: none; color: #ffaa99;">Battle</button>
        </div>
        <div class="user-info">Guest</div>
    </div>

    <div id="main-content">
        <div id="pantalla-inicio" class="pantalla active">
            <div id="home-left" class="home-col">
                <div class="matchmaking-box">
                    <button id="btn-find-battle" class="ps-button big-battle-btn">Battle!</button>
                    <button class="ps-button menu-btn" onclick="cambiarTab('teambuilder')">Teambuilder</button>
                </div>
            </div>
            <div id="home-mid" class="home-col"></div>
            <div id="home-right" class="home-col">
                <div id="lobby-header">Lobby</div>
                <div id="lobby-chat-content"></div>
                <div id="lobby-input"><input type="text" id="lobby-textfield" placeholder="Chat here..."></div>
            </div>
        </div>

        <div id="pantalla-teambuilder" class="pantalla">
            <div style="padding: 20px;"><h2>Teambuilder</h2></div>
        </div>

        <div id="pantalla-batalla" class="pantalla">
            <div id="left-pane">
                <div id="arena">
                    <div class="battler" id="opponent-side">
                        <div class="hp-box"><span id="name-opp">Jiraiya</span><div class="hp-bar-bg"><div class="hp-bar-fill" id="bar-opp"></div></div></div>
                        <img src="https://i.ibb.co/hZ2vPj9/jiraiya.png" class="sprite">
                    </div>
                    <div class="battler" id="player-side">
                        <div class="hp-box"><span id="name-p1">Izanagi</span><div class="hp-bar-bg"><div class="hp-bar-fill" id="bar-p1"></div></div></div>
                        <img src="https://i.ibb.co/F8H5H94/izanagi.png" class="sprite" id="sprite-p1">
                    </div>
                </div>
                <div id="controls"><div class="moves-grid"></div></div>
            </div>
            <div id="right-pane"><div id="log-content"></div><div id="chat-input"><input type="text" id="chat-textfield"></div></div>
        </div>
    </div>

    <script>
        function cambiarTab(id) {
            document.querySelectorAll('.pantalla').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('pantalla-'+id).classList.add('active');
            document.getElementById('tab-btn-'+id).classList.add('active');
        }

        const ws = new WebSocket('wss://persona-showdown-production.up.railway.app');
        document.getElementById('btn-find-battle').addEventListener('click', () => {
            document.getElementById('tab-btn-batalla').style.display = 'inline-block';
            cambiarTab('batalla');
            ws.send(JSON.stringify({ type: 'SEARCH_MATCH' }));
        });
        
        ws.onmessage = (e) => {
            const data = JSON.parse(e.data);
            if(data.type === 'UPDATE_STATE') {
                // Aquí iría tu lógica de actualización de barras
            }
        };
    </script>
</body>
</html>
