<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Persona Showdown</title>
    <style>
        /* =========================================
            RESET Y ESTILOS GLOBALES
            ========================================= */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: Verdana, Helvetica, Arial, sans-serif; 
            font-size: 10pt;
            background-color: #111; 
            color: #eee; 
            overflow: hidden; 
            height: 100vh; 
            width: 100vw; 
            display: flex; 
            flex-direction: column; 
        }

        /* Botones estándar */
        .ps-button {
            background: #333;
            border: 1px solid #555;
            border-radius: 3px;
            color: #eee;
            cursor: pointer;
            font-family: Verdana, Helvetica, Arial, sans-serif;
            font-size: 10pt;
            padding: 4px 10px;
        }
        .ps-button:hover:not(:disabled) { background: #444; border-color: #777; }
        .ps-button:disabled { background: #222; color: #666; cursor: not-allowed; border-color: #333; }

        /* =========================================
            TOP BAR (PESTAÑAS)
            ========================================= */
        #top-bar { 
            height: 35px; background: rgba(0, 0, 0, 0.6); display: flex; align-items: flex-end; 
            padding: 0 10px; border-bottom: 1px solid #444; flex-shrink: 0;
            justify-content: space-between;
        }
        
        .tabs-container { display: flex; gap: 2px; }
        .tab-btn {
            background: rgba(30, 30, 30, 0.8); color: #aaa; border: 1px solid #111; border-bottom: none;
            padding: 6px 14px; border-radius: 4px 4px 0 0; cursor: pointer;
            font-size: 13px; transition: background 0.2s, color 0.2s;
            height: 28px;
        }
        .tab-btn:hover { background: rgba(50, 50, 50, 0.9); color: #fff; }
        .tab-btn.active { background: rgba(0, 0, 0, 0.5); color: #fff; height: 30px; font-weight: bold; border: 1px solid #555; border-bottom: none; }
        .user-info { color: #88aadd; font-size: 13px; padding-bottom: 6px; font-weight: bold; }

        /* =========================================
            CONTENEDOR PRINCIPAL
            ========================================= */
        #main-content { flex-grow: 1; position: relative; width: 100vw; background: rgba(0, 0, 0, 0.3); }
        .pantalla { display: none !important; height: 100%; width: 100%; }
        .pantalla.active { display: flex !important; }

        /* =========================================
            PANTALLA DE INICIO
            ========================================= */
        #pantalla-inicio { padding: 20px; gap: 20px; justify-content: center; overflow-y: auto; }
        .home-col { display: flex; flex-direction: column; gap: 15px; }
        #home-left { width: 250px; }
        #home-mid { width: 300px; }
        #home-right { width: 400px; background: rgba(10, 10, 10, 0.8); border: 1px solid #333; border-radius: 4px; display: flex; }

        .matchmaking-box { display: flex; flex-direction: column; gap: 10px; }
        .ps-select-group label { display: block; font-size: 11px; color: #bbb; margin-bottom: 2px; font-weight: bold;}
        .ps-select-group select { width: 100%; padding: 4px; background: #222; color: #fff; border: 1px solid #555; border-radius: 3px; }
        
        .big-battle-btn { width: 100%; padding: 12px 5px; font-size: 18px; font-weight: bold; margin: 10px 0; text-align: center; }
        .menu-btn { width: 100%; padding: 6px; text-align: center; font-weight: bold; }

        .news-box { background: rgba(30, 30, 30, 0.8); border: 1px solid #444; border-radius: 3px; color: #ddd; }
        .news-header { background: rgba(0, 0, 0, 0.3); padding: 5px 10px; font-weight: bold; border-bottom: 1px solid #444; font-size: 11px;}
        .news-content { padding: 10px; font-size: 12px; }

        #lobby-header { padding: 8px 10px; background: rgba(0,0,0,0.5); border-bottom: 1px solid #222; color: #fff; font-size: 14px; font-weight: bold; }
        #lobby-chat-content { flex-grow: 1; padding: 10px; overflow-y: auto; font-size: 13px; color: #ccc; height: 300px; }
        #lobby-input { padding: 5px; background: rgba(0,0,0,0.5); border-top: 1px solid #222; display: flex; }
        #lobby-input input { flex-grow: 1; background: #222; border: 1px solid #555; color: #fff; padding: 5px; }

        /* =========================================
            PANTALLA DE BATALLA (HUD OSCURO)
            ========================================= */
        #left-pane { flex: 6; display: flex; flex-direction: column; background: #222; border-right: 1px solid #111; }
        #right-pane { flex: 4; display: flex; flex-direction: column; background: #1a1a1a; }

        #arena { flex: 6; position: relative; background-color: #8fb88b; background-size: cover; border-bottom: 1px solid #111; }
        .turn-box { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: #fff; padding: 2px 8px; border: 1px solid #555; border-radius: 4px; font-weight: bold; z-index: 20;}

        .battler { position: absolute; display: flex; flex-direction: column; align-items: center; }
        #player-side { bottom: 10px; left: 15%; } 
        #opponent-side { top: 20px; right: 20%; }
        .sprite { width: 260px; height: 260px; object-fit: contain; }
        #sprite-p1 { transform: scaleX(-1); } 
        
        .hp-box { background: rgba(0, 0, 0, 0.75); padding: 4px 8px; border-radius: 4px; font-size: 11px; z-index: 10; width: 200px; border: 1px solid #333;}
        .hp-bar-bg { background: #333; height: 6px; width: 100%; margin-top: 4px; border-radius: 3px; overflow: hidden; }
        .hp-bar-fill { background: #48c774; height: 100%; transition: width 0.3s; }

        /* HUD OSCURO */
        #controls { flex: 4; background: #222; padding: 10px; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #444; }
        .controls-header { display: flex; justify-content: space-between; font-size: 12px; color: #ccc; }
        .controls-header strong { color: #fff; }
        .timer-btn { background: #555; color: #eee; border: 1px solid #777; padding: 2px 10px; border-radius: 3px; cursor: pointer; font-size: 11px;}

        .moves-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
        .move-btn { background: #333; border: 1px solid #555; border-radius: 3px; padding: 8px; cursor: pointer; color: #eee; font-weight: bold; }
        .move-btn:hover:not(:disabled) { background: #444; }
        .move-type { font-size: 9px; color: #aaa; text-transform: uppercase; display: block; }
        .move-sp { font-size: 9px; color: #888; }
        
        .switch-title { font-size: 12px; color: #aaa; margin-top: 5px; }
        .switch-row { display: flex; gap: 5px; }
        .switch-btn { background: #333; border: 1px solid #555; padding: 4px 10px; cursor: pointer; color: #eee; font-size: 11px; }

        #log-header { padding: 8px; background: #111; border-bottom: 1px solid #333; text-align: right; }
        #log-content { flex-grow: 1; padding: 15px; font-size: 13px; color: #ccc; overflow-y: auto;}
        #chat-input { padding: 5px; background: #111; border-top: 1px solid #333; display: flex;}
        #chat-input input { flex-grow: 1; background: #222; border: 1px solid #555; color: #fff; padding: 5px; }
    </style>
</head>
<body>

    <div id="top-bar">
        <div class="tabs-container">
            <button class="tab-btn active" id="tab-btn-inicio" onclick="cambiarTab('inicio')">Home</button>
            <button class="tab-btn" id="tab-btn-teambuilder" onclick="cambiarTab('teambuilder')">Teambuilder</button>
            <button class="tab-btn" id="tab-btn-batalla" onclick="cambiarTab('batalla')" style="display: none; color: #ffaa99;">Battle</button>
        </div>
        <div class="user-info"><span id="username-display">Guest</span></div>
    </div>

    <div id="main-content">
        <div id="pantalla-inicio" class="pantalla active">
            <div id="home-left" class="home-col">
                <div class="matchmaking-box">
                    <div class="ps-select-group">
                        <label>Format:</label>
                        <select disabled><option>[Gen 5 Persona] OU</option></select>
                    </div>
                    <div class="ps-select-group">
                        <label>Team:</label>
                        <select disabled><option>Random team</option></select>
                    </div>
                    <button id="btn-find-battle" class="ps-button big-battle-btn">Battle!<br><small style="font-size: 10px; font-weight: normal; color: #aaa;">Find a random opponent</small></button>
                    <button class="ps-button menu-btn" onclick="cambiarTab('teambuilder')">Teambuilder</button>
                </div>
            </div>

            <div id="home-mid" class="home-col">
                <div class="news-box">
                    <div class="news-header">News</div>
                    <div class="news-content">
                        <h4>Welcome to Persona Showdown</h4>
                        <p>Alpha Prototype running on Railway.</p>
                    </div>
                </div>
            </div>

            <div id="home-right" class="home-col">
                <div id="lobby-header">Lobby</div>
                <div id="lobby-chat-content"></div>
                <div id="lobby-input"><input type="text" id="lobby-textfield" placeholder="Chat here..."></div>
            </div>
        </div>

        <div id="pantalla-teambuilder" class="pantalla">
            <div style="padding: 20px;"><h2>Teambuilder</h2><p>En construcción...</p></div>
        </div>

        <div id="pantalla-batalla" class="pantalla">
            <div id="left-pane">
                <div id="arena">
                    <div class="turn-box">Turn <span id="ui-turn">1</span></div>
                    <div class="battler" id="opponent-side">
                        <div class="hp-box"><span id="name-opp">...</span> <span id="porcentaje-opp" style="float:right;">100%</span><div class="hp-bar-bg"><div class="hp-bar-fill" id="bar-opp"></div></div></div>
                        <img src="" class="sprite" id="sprite-opp">
                    </div>
                    <div class="battler" id="player-side">
                        <div class="hp-box"><span id="name-p1">...</span> <span id="porcentaje-p1" style="float:right;">100%</span><div class="hp-bar-bg"><div class="hp-bar-fill" id="bar-p1"></div></div></div>
                        <img src="" class="sprite" id="sprite-p1">
                    </div>
                </div>

                <div id="controls">
                    <div class="controls-header">
                        <div>What will <strong id="ui-name-p1">...</strong> do?</div>
                        <button class="timer-btn">Timer</button>
                    </div>
                    <div class="moves-grid"></div>
                    <div class="switch-title">Switch</div>
                    <div class="switch-row">
                        <button class="switch-btn">Izanagi</button>
                        <button class="switch-btn" style="opacity: 0.5;">Jack Frost</button>
                    </div>
                </div>
            </div>

            <div id="right-pane">
                <div id="log-header"><button>Battle Options</button></div>
                <div id="log-content"></div>
                <div id="chat-input"><input type="text" id="chat-textfield" placeholder="Chat here..."></div>
            </div>
        </div>
    </div>

    <script>
        function cambiarTab(id) {
            document.querySelectorAll('.pantalla').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`pantalla-${id}`).classList.add('active');
            document.getElementById(`tab-btn-${id}`).classList.add('active');
        }

        const ws = new WebSocket('wss://persona-showdown-production.up.railway.app');
        
        document.getElementById('btn-find-battle').addEventListener('click', () => {
            document.getElementById('tab-btn-batalla').style.display = 'inline-block';
            cambiarTab('batalla');
            if(ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'SEARCH_MATCH' }));
        });

        // Funciones de lógica (se mantienen igual)
        ws.onmessage = (e) => {
            const data = JSON.parse(e.data);
            if (data.type === 'UPDATE_STATE') {
                // Actualizar UI de batalla...
            }
        };
    </script>
</body>
</html>
