<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Persona Showdown</title>
    <style>
        /* RESET Y ESTILO INDUSTRIAL */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: Verdana, Helvetica, Arial, sans-serif; font-size: 10pt;
            background-color: #111; background-size: cover; color: #eee; 
            overflow: hidden; height: 100vh; width: 100vw; display: flex; flex-direction: column; 
        }

        /* BOTONES CLÁSICOS */
        .ps-button {
            background: linear-gradient(to bottom, #f9f9f9, #e5e5e5);
            border: 1px solid #aaa; border-radius: 3px; color: #333; cursor: pointer;
            padding: 4px 10px; font-size: 10pt;
        }
        .ps-button:hover:not(:disabled) { background: linear-gradient(to bottom, #fff, #f0f0f0); border-color: #999; }
        .ps-button:disabled { background: #ddd; color: #888; cursor: not-allowed; }

        /* TOP BAR */
        #top-bar { height: 35px; background: rgba(0, 0, 0, 0.6); display: flex; align-items: flex-end; padding: 0 10px; border-bottom: 1px solid #444; }
        .tabs-container { display: flex; gap: 2px; }
        .tab-btn { background: rgba(30, 30, 30, 0.8); color: #aaa; border: 1px solid #111; border-bottom: none; padding: 6px 14px; border-radius: 4px 4px 0 0; cursor: pointer; font-size: 13px; height: 28px; }
        .tab-btn.active { background: rgba(0, 0, 0, 0.5); color: #fff; height: 30px; font-weight: bold; border: 1px solid #555; border-bottom: none; }

        /* PANTALLAS */
        #main-content { flex-grow: 1; position: relative; width: 100vw; }
        .pantalla { display: none !important; height: 100%; width: 100%; }
        .pantalla.active { display: flex !important; }

        /* INICIO (3 COLUMNAS) */
        #pantalla-inicio { padding: 20px; gap: 20px; justify-content: center; overflow-y: auto; }
        .home-col { display: flex; flex-direction: column; gap: 15px; }
        #home-left { width: 250px; }
        #home-mid { width: 300px; }
        #home-right { width: 400px; background: rgba(10, 10, 10, 0.8); border: 1px solid #333; border-radius: 4px; display: flex; flex-direction: column; }

        .matchmaking-box { display: flex; flex-direction: column; gap: 10px; }
        .ps-select-group { margin-bottom: 5px; }
        .ps-select-group label { display: block; font-size: 11px; color: #bbb; margin-bottom: 2px; }
        .ps-select-group select { width: 100%; padding: 4px; background: #ddd; color: #222; border: 1px solid #888; border-radius: 3px; }
        
        .big-battle-btn { width: 100%; padding: 12px 5px; font-size: 18px; font-weight: bold; margin: 10px 0; }
        .menu-btn { width: 100%; padding: 6px; text-align: center; font-weight: bold; color: #444; }

        #lobby-header { padding: 8px 10px; background: rgba(0,0,0,0.5); border-bottom: 1px solid #222; color: #fff; font-size: 14px; font-weight: bold; }
        #lobby-chat-content { flex-grow: 1; padding: 10px; overflow-y: auto; font-size: 13px; color: #ccc; }
        #lobby-input { padding: 5px; background: rgba(0,0,0,0.5); border-top: 1px solid #222; }
        #lobby-input input { width: 100%; background: #fff; border: 1px solid #aaa; color: #222; padding: 5px; border-radius: 3px; }
    </style>
</head>
<body>

    <div id="top-bar">
        <div class="tabs-container">
            <button class="tab-btn active" id="tab-btn-inicio" onclick="cambiarTab('inicio')">Home</button>
            <button class="tab-btn" id="tab-btn-teambuilder" onclick="cambiarTab('teambuilder')">Teambuilder</button>
            <button class="tab-btn" id="tab-btn-batalla" onclick="cambiarTab('batalla')" style="display: none; color: #ffaa99;">Battle</button>
        </div>
    </div>

    <div id="main-content">
        <div id="pantalla-inicio" class="pantalla active">
            <div id="home-left" class="home-col">
                <div class="matchmaking-box">
                    <div class="ps-select-group">
                        <label>Format:</label>
                        <select disabled><option>[Gen 5 Persona] OU</option></select>
                    </div>
                    <div class="ps-select-group">
                        <label>Team:</label>
                        <select disabled><option>Random team</option></select>
                    </div>
                    <label style="font-size: 11px;"><input type="checkbox" disabled> Don't allow spectators</label>
                    <button id="btn-find-battle" class="ps-button big-battle-btn">Battle!</button>
                    <button class="ps-button menu-btn" onclick="cambiarTab('teambuilder')">Teambuilder</button>
                    <button class="ps-button menu-btn" disabled>Ladder</button>
                    <button class="ps-button menu-btn" disabled>Tournaments</button>
                </div>
            </div>
            <div id="home-mid" class="home-col"></div>
            <div id="home-right" class="home-col">
                <div id="lobby-header">Lobby</div>
                <div id="lobby-chat-content"></div>
                <div id="lobby-input"><input type="text" id="lobby-textfield" placeholder="Chat here..."></div>
            </div>
        </div>
        
        <div id="pantalla-teambuilder" class="pantalla" style="padding: 20px;"><h2>Teambuilder</h2></div>
        <div id="pantalla-batalla" class="pantalla">...</div>
    </div>

    <script>
        function cambiarTab(id) {
            document.querySelectorAll('.pantalla').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('pantalla-'+id).classList.add('active');
            document.getElementById('tab-btn-'+id).classList.add('active');
        }
        // ... (resto de tu lógica de WebSocket sigue igual)
    </script>
</body>
</html>
