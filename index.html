<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Persona Showdown - Online</title>
    <style>
        /* RESET BÁSICO */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Verdana', sans-serif; background: #222; color: #eee; display: flex; height: 100vh; overflow: hidden; }

        /* --- CONTENEDORES PRINCIPALES --- */
        #left-pane { flex: 6; display: flex; flex-direction: column; background: #333; border-right: 2px solid #111; }
        #right-pane { flex: 4; display: flex; flex-direction: column; background: #2b2b2b; }

        /* --- ZONA DE ARENA (Arriba Izquierda) --- */
        #arena { 
            flex: 6; 
            position: relative; 
            background-color: #8fb88b; 
            background-image: url('https://placehold.co/800x400/8fb88b/8fb88b?text='); 
            background-size: cover;
            border-bottom: 2px solid #111;
        }

        .turn-box { position: absolute; top: 10px; left: 10px; background: rgba(255,255,255,0.7); color: #333; padding: 2px 8px; border: 1px solid #999; border-radius: 4px; font-weight: bold; font-size: 14px; z-index: 20;}

        /* Posicionamiento estilo isométrico (Showdown) */
        .battler { position: absolute; display: flex; flex-direction: column; align-items: center; }
        #player-side { bottom: 10px; left: 15%; } 
        #opponent-side { top: 20px; right: 20%; }

        /* --- SPRITES AUMENTADOS Y VOLTEADOS --- */
        .sprite { 
            width: 260px; 
            height: 260px; 
            object-fit: contain; 
        }
        
        #sprite-p1 { 
            transform: scaleX(-1); 
        } 
        
        /* Cajas flotantes de HP */
        .hp-box { background: rgba(0, 0, 0, 0.7); padding: 4px 8px; border-radius: 4px; font-size: 12px; z-index: 10; text-align: right; width: 200px; border: 1px solid #555;}
        
        #player-side .hp-box { margin-bottom: -20px; text-align: left;} 
        #opponent-side .hp-box { margin-bottom: -15px; }

        .hp-box span { font-weight: bold; float: left; }
        .hp-bar-bg { background: #555; height: 6px; width: 100%; margin-top: 4px; border-radius: 3px; overflow: hidden; border: 1px solid #222;}
        .hp-bar-fill { background: #48c774; height: 100%; width: 100%; transition: width 0.3s; }

        /* --- ZONA DE CONTROLES (Abajo Izquierda) --- */
        #controls { flex: 4; background: #444; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        
        .controls-header { display: flex; justify-content: space-between; font-size: 13px; color: #ccc; }
        .timer-btn { background: #885555; color: white; border: 1px solid #aa6666; padding: 2px 10px; border-radius: 4px; cursor: pointer; }

        h3 { font-size: 14px; color: #ffaa99; font-style: italic; margin-bottom: 5px;}

        /* Cuadrícula de ataques */
        .moves-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 10px; }
        .move-btn { 
            background: #e6e6e6; border: 1px solid #999; border-radius: 4px; padding: 8px; 
            cursor: pointer; text-align: center; color: #333; position: relative; font-weight: bold;
        }
        .move-btn:hover { background: #fff; }
        .move-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .move-type { position: absolute; bottom: 4px; left: 8px; font-size: 10px; font-weight: normal; color: #666;}
        .move-sp { position: absolute; bottom: 4px; right: 8px; font-size: 10px; font-weight: normal; color: #666;}

        /* Botones de cambio (Switch) */
        h3.switch-title { color: #aaa; }
        .switch-row { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 5px;}
        .switch-btn { background: #fff; border: 1px solid #999; border-radius: 4px; padding: 4px 8px; cursor: pointer; font-size: 12px; color: #333; display: flex; align-items: center; gap: 5px;}

        /* --- ZONA DE LOG Y CHAT (Derecha) --- */
        #log-header { padding: 10px; background: #333; border-bottom: 1px solid #111; text-align: right; }
        #log-header button { background: #444; color: #eee; border: 1px solid #666; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
        
        #log-content { flex-grow: 1; padding: 15px; overflow-y: auto; font-size: 13px; line-height: 1.4; color: #ccc; }
        .log-turn { font-size: 16px; font-weight: bold; color: #fff; margin: 15px 0 5px 0; border-bottom: 1px solid #555; padding-bottom: 2px;}
        .log-damage { color: #ff8888; }
        
        #chat-input { padding: 10px; background: #333; border-top: 1px solid #111; display: flex; gap: 10px;}
        #chat-input input { flex-grow: 1; background: #222; border: 1px solid #555; color: white; padding: 6px; border-radius: 4px; }
    </style>
</head>
<body>

    <!-- MITAD IZQUIERDA: JUEGO -->
    <div id="left-pane">
        <div id="arena">
            <div class="turn-box">Turn <span id="ui-turn">1</span></div>
            
            <!-- Enemigo Jiraiya -->
            <div class="battler" id="opponent-side">
                <div class="hp-box">
                    <span id="name-opp">Jiraiya</span> <span style="float:right; font-weight:normal;" id="porcentaje-opp">100%</span>
                    <div style="clear:both;"></div>
                    <div class="hp-bar-bg"><div class="hp-bar-fill" id="bar-opp"></div></div>
                </div>
                <img src="https://placehold.co/260x260/333/eee?text=Jiraiya+Sprite" class="sprite" id="sprite-opp">
            </div>

            <!-- Jugador Izanagi -->
            <div class="battler" id="player-side">
                <div class="hp-box">
                    <span id="name-p1">Izanagi</span> <span style="float:right; font-weight:normal;" id="porcentaje-p1">100%</span>
                    <div style="clear:both;"></div>
                    <div class="hp-bar-bg"><div class="hp-bar-fill" id="bar-p1"></div></div>
                </div>
                <img src="https://placehold.co/260x260/333/eee?text=Izanagi+Sprite" class="sprite" id="sprite-p1">
            </div>
        </div>

        <!-- Controles -->
        <div id="controls">
            <div class="controls-header">
                <div>What will <strong>Izanagi</strong> do? <span style="background:#222; padding:2px 4px; border-radius:2px; margin-left:5px;">HP <span id="ui-hp-num">150/150</span></span></div>
                <button class="timer-btn">⏳ 2:30</button>
            </div>

            <h3>Attack</h3>
            <div class="moves-grid">
                <button class="move-btn" onclick="ejecutarTurno('Zio', 20, 30, 'Electric')">
                    Zio
                    <span class="move-type" style="color: #cccc00;">Electric</span>
                    <span class="move-sp">4 SP</span>
                </button>
                <button class="move-btn" onclick="ejecutarTurno('Cleave', 15, 25, 'Physical')">
                    Cleave
                    <span class="move-type" style="color: #cc8888;">Physical</span>
                    <span class="move-sp">10% HP</span>
                </button>
                <button class="move-btn" onclick="ejecutarTurno('Rakunda', 0, 0, 'Support')">
                    Rakunda
                    <span class="move-type" style="color: #8888cc;">Support</span>
                    <span class="move-sp">8 SP</span>
                </button>
                <button class="move-btn" onclick="ejecutarTurno('Tarukaja', 0, 0, 'Support')">
                    Tarukaja
                    <span class="move-type" style="color: #8888cc;">Support</span>
                    <span class="move-sp">8 SP</span>
                </button>
            </div>

            <h3 class="switch-title">Switch</h3>
            <div class="switch-row">
                <button class="switch-btn">⚔️ Izanagi</button>
                <button class="switch-btn" style="opacity: 0.5;">🔥 Jack Frost</button>
                <button class="switch-btn" style="opacity: 0.5;">💨 Pixie</button>
            </div>
        </div>
    </div>

    <!-- MITAD DERECHA: LOG Y CHAT -->
    <div id="right-pane">
        <div id="log-header">
            <button>Connecting...</button>
        </div>
        
        <div id="log-content">
            <div style="color: #888;">
                Format:<br>
                <strong>[Gen 5 Persona] OU</strong><br>
                <span style="background: #555; color: white; padding: 2px 4px; border-radius: 4px; font-size: 11px;">Rated battle</span><br>
                <em>Rule: Baton Pass is restricted.</em><br>
                <em>Rule: SP Adhesives are banned.</em>
            </div>
            <br>
        </div>

        <div id="chat-input">
            <strong style="color: #ffaa99; line-height: 28px;">Player:</strong>
            <input type="text" placeholder="...">
        </div>
    </div>

    <!-- LÓGICA DE CONEXIÓN ONLINE -->
    <script>
        // Apunta directamente a tu servidor activo en Railway
        const SERVER_URL = 'wss://persona-showdown-production.up.railway.app'; 
        const ws = new WebSocket(SERVER_URL);

        let miNumeroJugador = null;
        let localGameState = null;

        function escribirLog(mensaje) {
            const log = document.getElementById("log-content");
            log.innerHTML += `<div>${mensaje}</div>`;
            log.scrollTop = log.scrollHeight;
        }

        function actualizarBarras(gameState) {
            localGameState = gameState;
            document.getElementById("ui-turn").innerText = gameState.turn;

            // Sincronizar vidas basadas en el Servidor
            let pct1 = (gameState.p1.hp / gameState.p1.hpMax) * 100;
            document.getElementById("bar-p1").style.width = pct1 + "%";
            document.getElementById("porcentaje-p1").innerText = Math.ceil(pct1) + "%";
            document.getElementById("ui-hp-num").innerText = `${gameState.p1.hp}/${gameState.p1.hpMax}`;
            if(pct1 < 25) document.getElementById("bar-p1").style.background = "#ff4444";
            else document.getElementById("bar-p1").style.background = "#48c774";

            let pct2 = (gameState.p2.hp / gameState.p2.hpMax) * 100;
            document.getElementById("bar-opp").style.width = pct2 + "%";
            document.getElementById("porcentaje-opp").innerText = Math.ceil(pct2) + "%";
            if(pct2 < 25) document.getElementById("bar-opp").style.background = "#ff4444";
            else document.getElementById("bar-opp").style.background = "#48c774";
        }

        ws.onopen = () => {
            escribirLog(`<span style="color: green; font-weight: bold;">[Sistema]: Conectado exitosamente al servidor de combate.</span>`);
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);

            if (data.type === 'INIT') {
                miNumeroJugador = data.playerNum;
                document.getElementById("log-header").innerHTML = `<button>You are Player ${miNumeroJugador}</button>`;
                escribirLog(`Battle started! Te has unido como <strong>Player ${miNumeroJugador}</strong>.`);
                actualizarBarras(data.gameState);
            }

            if (data.type === 'TURN_RESULT') {
                const attacker = data.gameState[`p${data.attackerNum}`];
                const defender = data.gameState[`p${data.defenderNum}`];

                escribirLog(`<div class="log-turn">Turn ${data.gameState.turn - 1}</div>`);
                escribirLog(`<b>${attacker.nombre}</b> used <b>${data.skillName}</b>!`);

                if (data.damage > 0) {
                    if (data.isWeak) {
                        escribirLog(`<span style="color:#ffee00; font-weight:bold;">¡PUNTO DÉBIL GOLPEADO!</span> (Opposing ${defender.nombre} is weak to that element)`);
                    }
                    let pctPerdido = Math.ceil((data.damage / defender.hpMax) * 100);
                    escribirLog(`<span class="log-damage">(The opposing ${defender.nombre} lost ${pctPerdido}% of its health!)</span>`);
                } else {
                    escribirLog(`But nothing happened!`);
                }

                actualizarBarras(data.gameState);

                if (defender.hp === 0) {
                    escribirLog(`<br><b style="color: #ff4444;">¡The opposing ${defender.nombre} fainted! El combate ha terminado.</b>`);
                }
            }
        };

        function ejecutarTurno(nombreAtaque, minDmg, maxDmg, tipoAtaque) {
            if (!localGameState) return;
            const miPersona = localGameState[`p${miNumeroJugador}`];
            if (miPersona.hp === 0) return;

            const actionPayload = {
                type: 'ATTACK',
                nombreAtaque: nombreAtaque,
                minDmg: minDmg,
                maxDmg: maxDmg,
                tipoAtaque: tipoAtaque
            };

            ws.send(JSON.stringify(actionPayload));
        }
    </script>
</body>
</html>
